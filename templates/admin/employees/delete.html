{% extends "base.html" %}
{% block title %}Delete Employee{% endblock %}
{% block content %}
  <h1 class="h5 mb-3">Delete Employee</h1>
  <div class="alert alert-warning">
    Are you sure you want to delete <strong>{{ employee.employee_id }}</strong> ({{ employee.username }})?
  </div>
  <form method="post">
    {% csrf_token %}
    <a class="btn btn-secondary" href="{% url 'employee_list' %}">Cancel</a>
    <button class="btn btn-danger" type="submit">Delete</button>
  </form>
{% endblock %}
