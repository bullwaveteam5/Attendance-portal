{% extends "base.html" %}
{% block title %}Request Increment{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="glass card border-0 shadow-lg">
        <div class="card-body p-4 p-md-5">
          <h1 class="h5 mb-2">Request Salary Increment</h1>
          <p class="text-muted mb-4">This will submit a <strong>20%</strong> increment request to HR for approval.</p>
          <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Note (optional)</label>
              {{ form.note }}
              {{ form.note.errors }}
            </div>
            <button class="btn btn-primary w-100" type="submit">Submit Request</button>
          </form>
          <div class="mt-3 small">
            <a class="link-muted" href="{% url 'employee_dashboard' %}">Back</a>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
